<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ai-orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#3E2EA6"/>
    </linearGradient>
    <linearGradient id="ai-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#7C6CF0"/>
    </linearGradient>
    <radialGradient id="ai-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141034"/>
      <stop offset="100%" stop-color="#0B0920"/>
    </radialGradient>
  </defs>

  <circle cx="240" cy="180" r="150" fill="url(#ai-bg)"/>

  <!-- orbit ring of nodes, suggests always-on network / assistant awareness -->
  <ellipse cx="240" cy="180" rx="122" ry="122" fill="none" stroke="url(#ai-ring)" stroke-width="1.6" stroke-opacity="0.5"/>
  <g fill="#5EEAD4">
    <circle cx="362" cy="180" r="4"/>
    <circle cx="240" cy="58" r="4"/>
    <circle cx="118" cy="180" r="4"/>
    <circle cx="240" cy="302" r="3.5"/>
    <circle cx="318" cy="102" r="3"/>
    <circle cx="162" cy="258" r="3"/>
  </g>
  <path d="M362,180 L240,58 M240,58 L118,180 M118,180 L240,302 M240,302 L362,180" fill="none" stroke="#5EEAD4" stroke-width="1" stroke-opacity="0.25"/>

  <!-- central orb, abstract assistant face -->
  <circle cx="240" cy="180" r="70" fill="url(#ai-orb)"/>
  <circle cx="240" cy="180" r="70" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-opacity="0.5"/>

  <!-- minimal face: two listening arcs and a pulse core -->
  <path d="M204,168 a10,14 0 0 1 0,28" fill="none" stroke="#E8E4FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M276,168 a10,14 0 0 0 0,28" fill="none" stroke="#E8E4FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="182" r="9" fill="#5EEAD4"/>
  <path d="M240,182 m-16,0 a16,16 0 1,1 32,0 a16,16 0 1,1 -32,0" fill="none" stroke="#5EEAD4" stroke-width="1.4" stroke-opacity="0.6"/>

  <text x="240" y="378" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600" fill="#F1EEFF" letter-spacing="2">NOVA<tspan fill="#5EEAD4">AI</tspan></text>
  <text x="240" y="404" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#9C93D8" letter-spacing="4">YOUR PERSONAL ASSISTANT</text>
</svg>
